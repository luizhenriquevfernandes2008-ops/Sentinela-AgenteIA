# Configuração para publicar no Render (https://render.com) com um clique.
# No painel do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: sentinela
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Aceita conexões de fora do servidor (o Render informa a porta pela variável PORT).
      - key: HOST
        value: 0.0.0.0
      # Interruptor da IA: não fica aqui de propósito, para o Render não desfazer
      # a sua escolha a cada deploy. Em Environment, crie MODO_AGENTE com
      # "simulado" (sem IA) ou "groq" (IA grátis; precisa de GROQ_API_KEY).
      # Teto de gasto por dia com provedores pagos (Claude). 0 = nunca gastar.
      - key: LIMITE_USD_DIA
        value: "0"
      # Chave da API da loja gerada pelo Render, em vez da chave de exemplo.
      - key: LOJA_API_KEY
        generateValue: true
      # Senha do painel. O Render sorteia uma senha forte; veja (ou troque por
      # uma sua, com 12+ caracteres) em Environment. Sem ela o servidor não sobe.
      - key: SENHA_OPERADOR
        generateValue: true
      # Assina os cookies de login (assim o login sobrevive quando o serviço reinicia).
      - key: SEGREDO_SESSAO
        generateValue: true
